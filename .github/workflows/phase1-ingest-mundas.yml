name: Phase 1 ingest - The Mundas and Their Country

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase1-ingest-mundas.yml"
      - "corpus/tools/ingest_djvu_xml.py"
      - "corpus/tools/validate_chunks.py"
      - "corpus/sources/book_mundas_1912.json"

permissions:
  contents: write

concurrency:
  group: phase1-ingest-mundas
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Johar AI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire and verify Internet Archive OCR
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=corpus/sources/book_mundas_1912.json
          IDENTIFIER="$(python - <<'PY'
          import json
          s=json.load(open('corpus/sources/book_mundas_1912.json', encoding='utf-8'))
          print(s['upstreamMachineReadableSource']['identifier'])
          PY
          )"

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://archive.org/metadata/$IDENTIFIER" -o /tmp/ia_metadata.json

          python - "$IDENTIFIER" <<'PY' > /tmp/ia_urls.env
          import json, sys
          from urllib.parse import quote

          identifier = sys.argv[1]
          metadata = json.load(open('/tmp/ia_metadata.json', encoding='utf-8'))
          names = [f.get('name', '') for f in metadata.get('files', [])]
          djvu = next((n for n in names if n.lower().endswith('_djvu.xml')), None)
          scandata = next((n for n in names if n.lower().endswith('_scandata.xml')), None)
          if not djvu or not scandata:
              print('echo "Available IA files:" >&2')
              for name in names[:80]:
                  print(f'echo {quote(name)!r} >&2')
              print('exit 44')
          else:
              base = f'https://archive.org/download/{quote(identifier, safe="")}/'
              print(f'DJVU_NAME={quote(djvu, safe="")!r}')
              print(f'SCANDATA_NAME={quote(scandata, safe="")!r}')
              print(f'DJVU_URL={base + quote(djvu, safe="")!r}')
              print(f'SCANDATA_URL={base + quote(scandata, safe="")!r}')
          PY
          source /tmp/ia_urls.env

          echo "Resolved DjVu:     $DJVU_NAME"
          echo "Resolved scandata: $SCANDATA_NAME"
          curl --fail --location --retry 3 --retry-delay 2 "$DJVU_URL" -o /tmp/mundas_djvu.xml
          curl --fail --location --retry 3 --retry-delay 2 "$SCANDATA_URL" -o /tmp/mundas_scandata.xml

          ACTUAL_DJVU="$(sha256sum /tmp/mundas_djvu.xml | awk '{print $1}')"
          ACTUAL_SCANDATA="$(sha256sum /tmp/mundas_scandata.xml | awk '{print $1}')"
          echo "DjVu SHA256:     $ACTUAL_DJVU"
          echo "Scandata SHA256: $ACTUAL_SCANDATA"

          python - "$SOURCE" "$ACTUAL_DJVU" "$ACTUAL_SCANDATA" "$DJVU_NAME" "$SCANDATA_NAME" <<'PY'
          import json, sys
          path, actual_djvu, actual_scandata, djvu_name, scandata_name = sys.argv[1:]
          source = json.load(open(path, encoding='utf-8'))
          upstream = source['upstreamMachineReadableSource']
          expected_djvu = upstream.get('expectedDjvuSha256')
          expected_scandata = upstream.get('expectedScandataSha256')
          if not expected_djvu or not expected_scandata:
              print('Source hashes are not pinned yet.')
              print(f'PIN_DJVU_NAME={djvu_name}')
              print(f'PIN_DJVU_SHA256={actual_djvu}')
              print(f'PIN_SCANDATA_NAME={scandata_name}')
              print(f'PIN_SCANDATA_SHA256={actual_scandata}')
              raise SystemExit(42)
          if expected_djvu != actual_djvu:
              raise SystemExit(f'DjVu SHA mismatch: expected {expected_djvu}, got {actual_djvu}')
          if expected_scandata != actual_scandata:
              raise SystemExit(f'Scandata SHA mismatch: expected {expected_scandata}, got {actual_scandata}')
          expected_djvu_name = upstream.get('djvuXmlFile')
          expected_scandata_name = upstream.get('scandataFile')
          if expected_djvu_name and expected_djvu_name != djvu_name:
              raise SystemExit(f'DjVu filename mismatch: expected {expected_djvu_name}, got {djvu_name}')
          if expected_scandata_name and expected_scandata_name != scandata_name:
              raise SystemExit(f'Scandata filename mismatch: expected {expected_scandata_name}, got {scandata_name}')
          print('Pinned Internet Archive derivatives verified.')
          PY

      - name: Build page-aware OCR chunk pack
        shell: bash
        run: |
          set -euo pipefail
          OUT=corpus/processed/book_mundas_1912
          python corpus/tools/ingest_djvu_xml.py \
            --djvu /tmp/mundas_djvu.xml \
            --scandata /tmp/mundas_scandata.xml \
            --source corpus/sources/book_mundas_1912.json \
            --out-dir "$OUT"

          python corpus/tools/validate_chunks.py \
            --chunks "$OUT/rag_chunks.jsonl" \
            --stats "$OUT/stats.json" \
            --source corpus/sources/book_mundas_1912.json \
            --out "$OUT/quality-report.json" \
            --min-pages 500 \
            --min-chunks 100 \
            --max-words 700

      - name: Commit generated corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/processed/book_mundas_1912

          if git diff --cached --quiet; then
            echo "Generated corpus already matches repository."
            exit 0
          fi

          git commit -m "corpus: ingest The Mundas and Their Country [skip ci]"
          git push
